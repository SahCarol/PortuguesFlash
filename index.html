<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domínio da Língua · Quiz</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="quiz-container">
        <!-- HEADER -->
        <div class="quiz-header">
            <div class="quiz-title">
                <span class="icon">📖</span>
                <h1>Domínio da <span>Língua</span></h1>
            </div>
            <div class="quiz-stats">
                <div class="stat-item">
                    <span class="stat-label">Acertos</span>
                    <span class="stat-value" id="acertos">0</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-label">Erros</span>
                    <span class="stat-value" id="erros">0</span>
                </div>
            </div>
        </div>

        <!-- PROGRESS BAR -->
        <div class="progress-section">
            <div class="progress-info">
                <span class="progress-label">Questão <span id="questaoAtual">1</span> de <span id="totalQuestoes">20</span></span>
                <span class="progress-percent" id="percentual">0%</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- TIMER -->
        <div class="timer-section">
            <div class="timer-bar-track">
                <div class="timer-bar-fill" id="timerBar"></div>
            </div>
            <span class="timer-text" id="timerText">20s</span>
        </div>

        <!-- BADGE -->
        <div class="badge" id="badgeAno">4º Ano</div>

        <!-- QUESTION -->
        <div class="question-area">
            <p class="question-text" id="pergunta">Carregando pergunta...</p>
        </div>

        <!-- OPTIONS -->
        <div class="options-grid" id="opcoes"></div>

        <!-- FEEDBACK -->
        <div class="feedback" id="feedback"></div>

        <!-- NEXT BUTTON -->
        <button class="next-btn" id="btnProximo">Próxima →</button>

        <!-- FOOTER -->
        <div class="quiz-footer">
            <span class="footer-label">Baseado na BNCC · Currículo PE</span>
            <button class="btn-reset" id="btnReset">↻ Reiniciar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
