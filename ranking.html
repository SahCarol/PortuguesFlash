<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domínio da Língua · Ranking</title>
    
    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/png" href="https://i.imgur.com/dApUYOU.png" />
    <link rel="shortcut icon" type="image/png" href="https://i.imgur.com/dApUYOU.png" />
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .ranking-container {
            max-width: 860px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 32px 36px 28px;
            border: 1px solid #333333;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .ranking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2a2a;
            flex-wrap: wrap;
            gap: 12px;
        }

        .ranking-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #e8e8e8;
        }

        .ranking-header h1 span { color: #4a9eff; }

        .ranking-header .back-btn {
            background: transparent;
            border: 1.5px solid #333333;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #888888;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
        }

        .ranking-header .back-btn:hover {
            border-color: #555555;
            color: #cccccc;
        }

        .ranking-empty {
            text-align: center;
            padding: 40px 20px;
            color: #666666;
        }

        .ranking-empty .empty-icon { font-size: 3rem; display: block; margin-bottom: 12px; }
        .ranking-empty .empty-text { font-size: 1.1rem; color: #888888; }
        .ranking-empty .empty-sub { font-size: 0.85rem; color: #555555; margin-top: 4px; }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #141414;
            border-radius: 10px;
            padding: 12px 18px;
            border: 1px solid #2a2a2a;
            transition: border-color 0.2s ease;
        }

        .ranking-item:hover {
            border-color: #4a9eff;
        }

        .ranking-item .position {
            font-size: 1.1rem;
            font-weight: 700;
            color: #555555;
            min-width: 36px;
            text-align: center;
        }

        .ranking-item .position.gold { color: #facc15; }
        .ranking-item .position.silver { color: #9ca3af; }
        .ranking-item .position.bronze { color: #fb923c; }

        .ranking-item .player-info { flex: 1; }
        .ranking-item .player-name { font-size: 0.95rem; font-weight: 600; color: #e8e8e8; }
        .ranking-item .player-detail { font-size: 0.7rem; color: #666666; }

        .ranking-item .player-stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .ranking-item .player-stats .stat {
            text-align: center;
        }

        .ranking-item .player-stats .stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: #e8e8e8;
        }

        .ranking-item .player-stats .stat-value.green { color: #4ade80; }
        .ranking-item .player-stats .stat-value.red { color: #f87171; }
        .ranking-item .player-stats .stat-value.blue { color: #4a9eff; }

        .ranking-item .player-stats .stat-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            color: #666666;
            letter-spacing: 0.3px;
        }

        .ranking-item .player-score {
            font-size: 1.4rem;
            font-weight: 800;
            color: #4a9eff;
            min-width: 60px;
            text-align: right;
        }

        .ranking-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .ranking-footer .total-text {
            font-size: 0.75rem;
            color: #666666;
        }

        .ranking-footer .total-text strong {
            color: #aaaaaa;
        }

        @media (max-width: 600px) {
            .ranking-container { padding: 20px 16px; }
            .ranking-item { flex-wrap: wrap; padding: 10px 14px; }
            .ranking-item .player-stats { gap: 12px; flex-wrap: wrap; }
            .ranking-item .player-score { font-size: 1.1rem; min-width: 40px; }
            .ranking-header h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="ranking-container">
        <div class="ranking-header">
            <h1>🏆 <span>Ranking</span></h1>
            <a href="index.html" class="back-btn">← Voltar</a>
        </div>

        <div id="rankingList">
            <div class="ranking-empty">
                <span class="empty-icon">📊</span>
                <div class="empty-text">Nenhum jogo registrado ainda</div>
                <div class="empty-sub">Jogue uma partida para aparecer aqui!</div>
            </div>
        </div>

        <div class="ranking-footer">
            <span class="total-text">Total de registros: <strong id="totalRegistros">0</strong></span>
        </div>
    </div>

    <script>
        // ================================================================
        //  RANKING - SEM TREMEDEIRA (CARREGA UMA ÚNICA VEZ)
        // ================================================================

        function carregarRanking() {
            try {
                const dados = JSON.parse(localStorage.getItem('ranking') || '[]');
                const container = document.getElementById('rankingList');
                const totalRegistros = document.getElementById('totalRegistros');

                if (dados.length === 0) {
                    container.innerHTML = `
                        <div class="ranking-empty">
                            <span class="empty-icon">📊</span>
                            <div class="empty-text">Nenhum jogo registrado ainda</div>
                            <div class="empty-sub">Jogue uma partida para aparecer aqui!</div>
                        </div>
                    `;
                } else {
                    const ranking = [...dados].sort((a, b) => {
                        if (b.percentual !== a.percentual) return b.percentual - a.percentual;
                        return a.tempoSegundos - b.tempoSegundos;
                    });

                    let items = '';
                    ranking.forEach((item, index) => {
                        const pos = index + 1;
                        let posClass = '';
                        let posEmoji = `${pos}º`;

                        if (pos === 1) { posClass = 'gold'; posEmoji = '🥇'; }
                        else if (pos === 2) { posClass = 'silver'; posEmoji = '🥈'; }
                        else if (pos === 3) { posClass = 'bronze'; posEmoji = '🥉'; }

                        const data = new Date(item.data);
                        const dataFormatada = data.toLocaleDateString('pt-BR', {
                            day: '2-digit', month: '2-digit', year: 'numeric',
                            hour: '2-digit', minute: '2-digit'
                        });

                        items += `
                            <div class="ranking-item">
                                <div class="position ${posClass}">${posEmoji}</div>
                                <div class="player-info">
                                    <div class="player-name">${item.apelido || 'Jogador'}</div>
                                    <div class="player-detail">${item.serie || ''} · ${dataFormatada}</div>
                                </div>
                                <div class="player-stats">
                                    <div class="stat">
                                        <div class="stat-value green">${item.acertos}</div>
                                        <div class="stat-label">Acertos</div>
                                    </div>
                                    <div class="stat">
                                        <div class="stat-value red">${item.erros}</div>
                                        <div class="stat-label">Erros</div>
                                    </div>
                                    <div class="stat">
                                        <div class="stat-value blue">${item.tempo}</div>
                                        <div class="stat-label">Tempo</div>
                                    </div>
                                </div>
                                <div class="player-score">${item.percentual}%</div>
                            </div>
                        `;
                    });

                    container.innerHTML = `<div class="ranking-list">${items}</div>`;
                }

                totalRegistros.textContent = dados.length;

            } catch (e) {
                console.error('Erro ao carregar ranking:', e);
            }
        }

        // Carregar ao iniciar (UMA ÚNICA VEZ)
        carregarRanking();

        // NÃO HÁ setInterval - a página NÃO vai tremer!
        // Atualiza apenas se o usuário voltar para a aba (e olhe lá)
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                // Recarrega apenas quando o usuário volta para a aba
                carregarRanking();
            }
        });
    </script>
</body>
</html>
